name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (compile + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile scripts/serve.py
        run: python -m py_compile scripts/serve.py
      - name: Run pytest
        run: python -m pytest -q
      - name: Two-domain regression (needs local data/)
        run: |
          if [ -d data/gold_ir ]; then
            python scripts/verify_domains.py
          else
            echo "data/ absent (ADR-0003: specs are not redistributed); run locally"
          fi
      - name: Score snapshot consistency
        run: python tools/check_consistency.py --base results/score
      - name: Clean-clone smoke (no UI)
        run: PYTHON=python bash scripts/verify_clean.sh --no-smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install frontend deps
        working-directory: webapp
        run: npm ci
      - name: Install Playwright chromium
        working-directory: webapp
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: webapp
        run: npm run e2e
